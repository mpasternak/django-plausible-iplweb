name: CI

on: [pull_request, push]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Derived from requires-python (>=3.10) + Django floor (>=5.2) +
        # canonical Django x Python compatibility. Django 6.0 and 6.1 need Python >=3.12.
        include:
          # Django 5.2 LTS
          - { python-version: "3.10", django-version: "5.2" }
          - { python-version: "3.11", django-version: "5.2" }
          - { python-version: "3.12", django-version: "5.2" }
          - { python-version: "3.13", django-version: "5.2" }
          # Django 6.0
          - { python-version: "3.12", django-version: "6.0" }
          - { python-version: "3.13", django-version: "6.0" }
          - { python-version: "3.14", django-version: "6.0" }
          # Django 6.1
          - { python-version: "3.12", django-version: "6.1" }
          - { python-version: "3.13", django-version: "6.1" }
          - { python-version: "3.14", django-version: "6.1" }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so setuptools-scm can derive the version

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies (project + Django ${{ matrix.django-version }})
        run: |
          uv sync --all-extras --python ${{ matrix.python-version }}
          uv pip install "django~=${{ matrix.django-version }}.0"

      - name: Show resolved versions
        run: .venv/bin/python -c "import sys, django; print('PY:', sys.version); print('DJANGO:', django.get_version())"

      # --no-sync is required: a plain `uv run` re-syncs the environment from
      # uv.lock and silently undoes the `uv pip install django~=X.Y.0` pin above,
      # so every matrix cell would end up testing the same locked Django.
      - name: Run tests
        run: uv run --no-sync pytest --verbose --cov plausible/ --cov-report term tests/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint with ruff
        run: uv run ruff check . || true

      - name: Check formatting with ruff
        run: uv run ruff format --check . || true

      - name: Type-check with mypy
        run: uv run mypy plausible tests

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm needs tags/history

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Build package
        run: uv build

      - name: Check package metadata
        run: uv run --with twine twine check dist/*
