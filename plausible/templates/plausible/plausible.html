<script defer src="{{ plausible_script_url }}"></script>
<script>
  window.plausible = window.plausible || function () { (window.plausible.q = window.plausible.q || []).push(arguments) };
  plausible.init({{ plausible_init_options }});
  (function () {
    var path = window.location.pathname;
    var masks = {{ plausible_url_masks }};
    for (var i = 0; i < masks.length; i++) {
      path = path.replace(new RegExp(masks[i].pattern, masks[i].flags || "g"), masks[i].replacement);
    }
    var url = window.location.origin + path{% if plausible_keep_query_string %} + window.location.search{% endif %};
    plausible("pageview", { url: url });
  })();
</script>
